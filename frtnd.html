<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CampusGrid — Energy Load Forecasting & Peak Reduction</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
/* SAFETY NET 1: global error trap. If the main script throws before it
   finishes booting, paint a visible error card into #page instead of
   leaving it blank. Only active until __CG_BOOTED is set. */
(function(){
  function show(msg){
    if(window.__CG_BOOTED)return;
    var p=document.getElementById('page');if(!p||p.dataset.bootErr)return;
    p.dataset.bootErr='1';
    var card=document.createElement('div');card.className='card';card.style.marginTop='30px';
    var inner=document.createElement('div');inner.className='empty';
    inner.innerHTML='<b style="color:var(--danger)">Application failed to start</b>';
    var m=document.createElement('div');
    m.style.cssText='font-family:monospace;font-size:12px;margin:8px 0;color:var(--muted);word-break:break-word';
    m.textContent=String(msg||'Unknown error');
    var btn=document.createElement('button');btn.className='btn primary';btn.style.marginTop='12px';
    btn.textContent='Reset data & reload';
    btn.onclick=function(){try{localStorage.removeItem('campusgrid.db.v3')}catch(e){}location.reload()};
    inner.appendChild(m);inner.appendChild(btn);card.appendChild(inner);p.appendChild(card);
  }
  window.addEventListener('error',function(e){
    show((e&&e.message?e.message:'Script error')+(e&&e.lineno?' (line '+e.lineno+')':''));
  });
  window.__cgBootFail=show;
})();
</script>
<style>
:root{
  --bg:#f3f2ec; --surface:#fdfdfb; --surface2:#ecebe2; --ink:#1a2420; --muted:#69735f;
  --line:#e0dfd4; --line2:#cfcebf; --primary:#0e6b4f; --primary-soft:#e2efe7; --on-primary:#fff;
  --accent:#c47b1a; --accent-soft:#f7ecdb; --danger:#b23a2f; --danger-soft:#f7e3e0; --teal:#0e7490;
  --side:#10201a; --side-ink:#c9dbd0; --side-mut:#7d958a;
  --c1:#0e6b4f; --c2:#0e7490; --c3:#c47b1a; --c4:#a8432f; --c5:#5b6b7c; --c6:#5c7a2e;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 16px rgba(20,30,25,.06);
}
html[data-theme="dark"]{
  --bg:#0d1411; --surface:#141d18; --surface2:#1a2620; --ink:#e7ece7; --muted:#8fa096;
  --line:#243129; --line2:#31453a; --primary:#31a37e; --primary-soft:#183127; --on-primary:#06130d;
  --accent:#e0a13f; --accent-soft:#33281c; --danger:#e0705c; --danger-soft:#37201c; --teal:#3aa7bd;
  --c1:#31a37e; --c2:#3aa7bd; --c3:#e0a13f; --c4:#e0705c; --c5:#8fa2b5; --c6:#93b55a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;letter-spacing:.02em}
html[data-motion="off"] *{transition:none!important;animation:none!important}
.app{display:flex;min-height:100vh}
/* sidebar */
.sidebar{width:238px;flex-shrink:0;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .22s ease;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand-mark{width:36px;height:36px;border-radius:9px;background:#0e6b4f;display:grid;place-items:center;flex-shrink:0;border:1px solid #2c4a3d}
.brand-name{font-family:'Space Grotesk';font-size:16.5px;font-weight:700;color:#fff;white-space:nowrap}
.brand-sub{font-size:10.5px;color:var(--side-mut);white-space:nowrap;line-height:1.3}
.side-nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:9.5px 11px;border-radius:8px;color:var(--side-ink);font-size:13.5px;font-weight:500;position:relative;border:none;background:none;text-align:left;width:100%;transition:background .15s}
.nav-item:hover{background:rgba(255,255,255,.06)}
.nav-item.active{background:rgba(58,183,138,.16);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:7px;bottom:7px;width:3px;border-radius:3px;background:#3ab78a}
.nav-item svg{flex-shrink:0}
.nav-label{white-space:nowrap}
.side-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:9px}
.data-chip{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--side-mut);white-space:nowrap;overflow:hidden}
.data-chip .dot{width:7px;height:7px;border-radius:50%;background:#3ab78a;flex-shrink:0}
.collapse-btn{background:none;border:1px solid rgba(255,255,255,.12);color:var(--side-ink);border-radius:7px;padding:6px;display:flex;align-items:center;justify-content:center}
.collapse-btn svg{transition:transform .22s}
.app.collapsed .sidebar{width:66px}
.app.collapsed .brand-name,.app.collapsed .brand-sub,.app.collapsed .nav-label,.app.collapsed .data-chip span{display:none}
.app.collapsed .nav-item{justify-content:center;padding:10px}
.app.collapsed .collapse-btn svg{transform:rotate(180deg)}
.scrim{display:none}
/* topbar */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30}
.icon-btn{background:none;border:1px solid transparent;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);position:relative}
.icon-btn:hover{background:var(--surface2);color:var(--ink)}
.badge-dot{position:absolute;top:5px;right:5px;min-width:15px;height:15px;border-radius:8px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;padding:0 3px}
.crumbs{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);min-width:0}
.crumbs b{color:var(--ink);font-weight:600;white-space:nowrap}
.searchbox{position:relative;flex:1;max-width:420px;margin-left:auto}
.searchbox input{padding:7.5px 12px 7.5px 34px;border-radius:9px;background:var(--bg)}
.searchbox>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);display:none;max-height:320px;overflow-y:auto;z-index:60}
.search-drop.open{display:block}
.sr-item{display:flex;align-items:center;gap:10px;padding:9px 13px;font-size:13px;cursor:pointer}
.sr-item:hover{background:var(--surface2)}
.sr-item .kind{margin-left:auto;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tb-right{display:flex;align-items:center;gap:6px}
.dd{position:relative}
.dd-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);min-width:250px;display:none;z-index:60;overflow:hidden}
.dd.open .dd-menu{display:block}
.dd-head{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dd-item{display:flex;align-items:center;gap:10px;padding:9.5px 14px;font-size:13px;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--ink)}
.dd-item:hover{background:var(--surface2)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:12px;font-weight:600;font-family:'Space Grotesk';border:none}
.meta b{font-size:13px}.meta span{font-size:11.5px;color:var(--muted);display:block}
/* page scaffold */
#page{padding:24px 26px 60px;max-width:1280px;width:100%;margin:0 auto;flex:1}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:23px;font-weight:700;letter-spacing:-.01em}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:3px;max-width:680px}
.head-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 17px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .hint{font-size:11.5px;color:var(--muted);font-weight:400}
.card-b{padding:16px 17px}
.grid{display:grid;gap:16px}
.seg{display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:5.5px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:500;transition:background .15s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:20px;letter-spacing:.02em}
.chip.ok{background:var(--primary-soft);color:var(--primary)}
.chip.warn{background:var(--accent-soft);color:var(--accent)}
.chip.err{background:var(--danger-soft);color:var(--danger)}
.chip.mut{background:var(--surface2);color:var(--muted)}
.chip.info{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(5,1fr)}
.kpi{padding:16px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:none}
.kpi .k-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:6px}
.kpi .k-val{font-family:'Space Grotesk';font-size:24px;font-weight:700;margin-top:5px;letter-spacing:-.01em}
.kpi .k-val small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
.kpi .k-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.k-sub .up{color:var(--primary);font-weight:600}.k-sub .down{color:var(--danger);font-weight:600}
/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.tbl th.sortable{cursor:pointer}.tbl th.sortable:hover{color:var(--ink)}
.tbl th.sort-asc::after{content:"";display:inline-block;margin-left:5px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:4.5px solid var(--primary);vertical-align:middle}
.tbl th.sort-desc::after{content:"";display:inline-block;margin-left:5px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4.5px solid var(--primary);vertical-align:middle}
.tbl td{padding:9.5px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:color-mix(in srgb,var(--surface2) 55%,transparent)}
.row-flash{animation:flash 1.8s ease}
@keyframes flash{0%{background:var(--primary-soft)}100%{background:transparent}}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:11px 14px;font-size:12.5px;color:var(--muted)}
.pager button{border:1px solid var(--line2);background:var(--surface);border-radius:7px;min-width:28px;height:28px;font-size:12.5px;color:var(--ink)}
.pager button:disabled{opacity:.4}
/* forms & modals */
.field{margin-bottom:13px}
.field .err-t{color:var(--danger);font-size:11.5px;margin-top:4px;display:none}
.field.bad input,.field.bad select{border-color:var(--danger)}
.field.bad .err-t{display:block}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.m-ov{position:fixed;inset:0;background:rgba(12,18,15,.45);display:grid;place-items:center;z-index:80;padding:18px;animation:fade .16s ease}
@keyframes fade{from{opacity:0}}
.m-box{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.28);animation:pop .18s ease}
.m-box.wide{max-width:760px}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.985)}}
.m-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line)}
.m-h h3{font-size:15.5px}
.m-b{padding:17px 18px;overflow-y:auto}
.m-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}
/* toast / misc */
#toast-root{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:9px;z-index:100;max-width:340px}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--primary);border-radius:10px;box-shadow:var(--shadow);padding:11px 14px;font-size:13px;display:flex;gap:9px;align-items:flex-start;animation:slidein .22s ease}
.toast.err{border-left-color:var(--danger)}.toast.warn{border-left-color:var(--accent)}
.toast svg{flex-shrink:0;margin-top:1px;color:var(--primary)}
.toast.err svg{color:var(--danger)}.toast.warn svg{color:var(--accent)}
@keyframes slidein{from{opacity:0;transform:translateX(14px)}}
#tooltip{position:fixed;background:var(--side);color:#e7efe9;border-radius:8px;padding:8px 11px;font-size:12px;pointer-events:none;z-index:110;display:none;box-shadow:0 6px 22px rgba(0,0,0,.3);font-family:'IBM Plex Mono';line-height:1.55;max-width:280px}
.sk{background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:400% 100%;animation:shim 1.3s infinite;border-radius:8px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty svg{color:var(--line2);margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:3px}
.chart-box{position:relative}.chart-box svg{display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}
.legend i.dash{background-image:linear-gradient(90deg,currentColor 55%,transparent 55%);background-size:7px 100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{border:none;background:none;padding:10px 15px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.dd-panel{position:absolute;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;min-width:230px;max-height:280px;overflow-y:auto;display:none;z-index:50}
.dd-panel.open{display:block}
.dd-panel label.chk{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:13px;font-weight:400;color:var(--ink);cursor:pointer;margin:0}
.dd-panel label.chk:hover{background:var(--surface2)}
.dd-panel input[type=checkbox]{width:auto}
.alert-row{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.alert-row:last-child{border-bottom:none}
.a-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0}
.rec-card{display:flex;gap:14px;padding:15px 17px;border-bottom:1px solid var(--line);align-items:flex-start}
.rec-card:last-child{border-bottom:none}
.rec-rail{width:4px;border-radius:4px;align-self:stretch;flex-shrink:0}
.assump{font-size:12.5px;color:var(--muted);display:grid;gap:8px;list-style:none}
.assump li{padding-left:14px;position:relative}
.assump li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--primary);opacity:.5}
.stat-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat-mini .sm{background:var(--surface2);border-radius:10px;padding:11px 13px}
.stat-mini .sm b{font-family:'Space Grotesk';font-size:17px;display:block}
.stat-mini .sm span{font-size:11.5px;color:var(--muted)}
.drop-zone{border:1.5px dashed var(--line2);border-radius:12px;padding:30px;text-align:center;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s}
.drop-zone.over{border-color:var(--primary);background:var(--primary-soft)}
.qlist{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.qa{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:13px;font-weight:500;color:var(--ink);transition:border-color .15s}
.qa:hover{border-color:var(--primary)}
.qa svg{color:var(--primary)}
.doc h4{font-size:13.5px;margin:18px 0 6px;color:var(--primary)}
.doc p,.doc li{font-size:13px;color:var(--muted)}
.doc ul{margin-left:18px}
#print-root{display:none}
#hamburger{display:none}
@media (max-width:1080px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(4){border-left:none}.kpi{border-top:1px solid var(--line)}.kpi:nth-child(-n+3){border-top:none}}
@media (max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;width:250px}
  .sidebar.open{transform:none}
  .scrim{display:none;position:fixed;inset:0;background:rgba(10,15,12,.5);z-index:35}
  .scrim.show{display:block}
  #hamburger{display:grid}
  .app.collapsed .sidebar{width:250px}
  .app.collapsed .brand-name,.app.collapsed .nav-label,.app.collapsed .brand-sub,.app.collapsed .data-chip span{display:block}
  .app.collapsed .nav-item{justify-content:flex-start}
  #page{padding:18px 16px 60px}.searchbox{max-width:none}
}
@media (max-width:680px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{border-top:1px solid var(--line)!important;border-left:none}
  .kpi:nth-child(odd){border-left:1px solid var(--line)}
  .kpi:nth-child(-n+2){border-top:none}
  .form-grid{grid-template-columns:1fr}.qlist{grid-template-columns:1fr}
  .crumbs .crumb-root{display:none}
}
@media print{
  .app,#toast-root,#modal-root,#tooltip{display:none!important}
  #print-root{display:block!important}
  body{background:#fff;color:#111}
  .pr h2{font-family:'Space Grotesk';font-size:18px;margin-bottom:2px}
  .pr table{width:100%;border-collapse:collapse;font-size:11.5px;margin:10px 0 18px}
  .pr th,.pr td{border:1px solid #bbb;padding:5px 8px;text-align:left}
  .pr th{background:#efefef}
  .pr .pr-note{font-size:10.5px;color:#555;margin-top:24px;border-top:1px solid #bbb;padding-top:8px}
}
</style>
</head>
<body>
<noscript>This application requires JavaScript.</noscript>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">

function S() {

const api = {
  async request(method, path, {query={}, body={}}={}) {
    try {
      let url = API_BASE + path;
      const qKeys = Object.keys(query);
      if (qKeys.length) {
        const params = new URLSearchParams();
        for (const k of qKeys) {
          const val = query[k];
          if (val !== undefined && val !== null && val !== '') {
            if (Array.isArray(val)) {
              val.forEach(v => params.append(k, v));
            } else {
              params.append(k, val);
            }
          }
        }
        const qs = params.toString();
        if (qs) url += '?' + qs;
      }

      const opts = {
        method,
        headers: { 'Content-Type': 'application/json' }
      };
      if (method !== 'GET' && method !== 'HEAD' && body && Object.keys(body).length > 0) {
        opts.body = JSON.stringify(body);
      }

      const res = await fetch(url, opts);
      const data = await res.json().catch(() => null);

      if (!res.ok) {
        let errorMsg = `HTTP ${res.status}: ${res.statusText}`;
        if (data) {
          if (typeof data.detail === 'string') errorMsg = data.detail;
          else if (Array.isArray(data.detail) && data.detail[0] && data.detail[0].msg) errorMsg = data.detail[0].msg;
          else if (data.error) errorMsg = data.error;
        }
        return { ok: false, error: errorMsg, status: res.status };
      }

      // Synchronize in-memory cache so frontend lookups find actual DB items
      if (path === '/settings' && (method === 'GET' || method === 'PUT')) {
        if (DB.data) DB.data.settings = data;
      } else if (path === '/buildings' && method === 'GET') {
        if (DB.data && data && data.items) {
          const existingMap = new Map((DB.data.buildings || []).map(b => [b.id, b]));
          data.items.forEach(b => existingMap.set(b.id, b));
          DB.data.buildings = [...existingMap.values()];
          DB.data.meta.sample = DB.data.buildings.some(b => b.sample);
        }
      } else if (path === '/buildings/all' && method === 'GET') {
        if (DB.data && Array.isArray(data)) {
          const existingMap = new Map((DB.data.buildings || []).map(b => [b.id, b]));
          data.forEach(b => {
            if (!existingMap.has(b.id)) existingMap.set(b.id, b);
          });
          DB.data.buildings = [...existingMap.values()];
        }
      } else if (path.startsWith('/buildings/') && method === 'GET') {
        if (DB.data && data && data.id) {
          const idx = (DB.data.buildings || []).findIndex(b => b.id === data.id);
          if (idx >= 0) DB.data.buildings[idx] = data;
          else DB.data.buildings.push(data);
        }
      } else if (path === '/readings' && method === 'GET') {
        if (DB.data && data && data.items) {
          DB.data.readings = data.items;
        }
      } else if (path === '/recommendations' && method === 'GET') {
        if (DB.data && Array.isArray(data)) {
          DB.data.recs = data;
        }
      } else if (path.startsWith('/recommendations/') && method === 'PATCH') {
        if (DB.data && data && data.id) {
          const idx = (DB.data.recs || []).findIndex(r => r.id === data.id);
          if (idx >= 0) DB.data.recs[idx] = data;
          else (DB.data.recs = DB.data.recs || []).push(data);
        }
      } else if (path === '/overview' && method === 'GET') {
        if (DB.data && data) {
          if (data.threshold && DB.data.settings) DB.data.settings.peakThreshold = data.threshold;
          if (data.compare && DB.data.meta) {
            DB.data.meta.sample = (DB.data.buildings || []).some(b => b.sample);
          }
        }
      }

      return { ok: true, data };
    } catch (e) {
      return {
        ok: false,
        error: e.message || 'Cannot connect to backend server. Make sure the backend is running.',
        status: 500
      };
    }
  }
};

const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function niceTicks(min,max,n=5){const span=max-min||1,s0=span/Math.max(1,n),mag=Math.pow(10,Math.floor(Math.log10(s0))),nm=s0/mag,step=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag;const out=[];for(let v=Math.ceil(min/step)*step;v<=max+1e-9;v+=step)out.push(v);return out}

function lineChart(el,cfg){
  const W=Math.max(el.clientWidth||620,260),Hh=cfg.height||270,M={t:12,r:56,b:26,l:54};
  const all=cfg.series.flatMap(s=>s.points).concat(cfg.band?cfg.band.points:[]);
  if(!all.length){el.innerHTML='<div class="empty">No data for this selection</div>';return}
  let ymin=Infinity,ymax=-Infinity;
  for(const p of all){if(p.y==null||isNaN(p.y))continue;ymin=Math.min(ymin,p.y,p.y0??p.y,p.y1??p.y);ymax=Math.max(ymax,p.y,p.y0??p.y,p.y1??p.y)}

  if(!isFinite(ymin)){el.innerHTML='<div class="empty">No data</div>';return}

  if(cfg.band){const bp=cfg.band.points.filter(p=>p.y0!=null&&p.y1!=null&&!isNaN(p.y0)&&!isNaN(p.y1));

      for(let i=1;i<bp.length;i++)d+=' L'+sx(bp[i].x).toFixed(1)+' '+sy(bp[i].y1).toFixed(1);

  for(const s of cfg.series){
    const vis=s.points.filter(p=>p.y!=null&&!isNaN(p.y));

  el.innerHTML=`<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}">${g}</svg>`;
  const tt=$('#tooltip'),ch=$('#__ch',el),ov=$('#__ov',el);
  ov.addEventListener('mousemove',e=>{
    const r=el.getBoundingClientRect(),mx=e.clientX-r.left;

/* ================= UI primitives ================= */
function toast(msg,type='ok'){
  const t=document.createElement('div');t.className='toast '+type;
  t.innerHTML=I(type==='ok'?'check':'warn',16)+`<div>${msg}</div>`;
  $('#toast-root').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320)},3600);
}
function openModal({title,body,footer,wide,onClose}){
  const ov=document.createElement('div');ov.className='m-ov';
  ov.innerHTML=`<div class="m-box${wide?' wide':''}"><div class="m-h"><h3>${title}</h3><button class="icon-btn" data-close>${I('x')}</button></div><div class="m-b"></div>${footer?'<div class="m-f"></div>':''}</div>`;
  typeof body==='string'?$('.m-b',ov).innerHTML=body:$('.m-b',ov).appendChild(body);
  if(footer)typeof footer==='string'?$('.m-f',ov).innerHTML=footer:$('.m-f',ov).appendChild(footer);
  $('#modal-root').appendChild(ov);
  const close=()=>{ov.remove();document.removeEventListener('keydown',onKey);onClose&&onClose()};
  const onKey=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',onKey);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
  $('[data-close]',ov).addEventListener('click',close);
  $$('[data-cancel]',ov).forEach(b=>b.addEventListener('click',close));
  return{el:ov,close,$:s=>$(s,ov)};
}
function confirmDlg({title='Are you sure?',message,okText='Confirm',danger=false}){
  return new Promise(res=>{
    const m=openModal({title,body:`<p style="color:var(--muted);font-size:13.5px">${message}</p>`,
      footer:`<button class="btn" data-cancel>Cancel</button><button class="btn ${danger?'danger':'primary'}" data-ok>${okText}</button>`});
    $('[data-ok]',m.el).addEventListener('click',()=>{m.close();res(true)});
    m.el.addEventListener('mousedown',e=>{if(e.target===m.el)res(false)});
    const kc=e=>{if(e.key==='Escape'){res(false);document.removeEventListener('keydown',kc)}};
    document.addEventListener('keydown',kc);
  });
}
function skeleton(){const d=document.createElement('div');
  d.innerHTML=`<div class="sk" style="height:34px;width:280px;margin-bottom:22px"></div><div class="grid" style="gap:14px"><div class="sk" style="height:110px"></div><div class="grid" style="grid-template-columns:2fr 1fr"><div class="sk" style="height:300px"></div><div class="sk" style="height:300px"></div></div></div>`;

function errorState(root,msg){root.innerHTML=`<div class="card" style="margin-top:30px"><div class="empty">${I('warn',34)}<b>Something went wrong</b><span>${esc(msg||'Unknown error')}</span><div style="margin-top:14px"><button class="btn primary" onclick="renderApp()">Retry</button></div></div></div>`}
function emptyBlock(icon,title,sub){return `<div class="empty">${I(icon,34)}<b>${title}</b>${sub||''}</div>`}
function pagerHtml(page,pages,action){return `<div class="pager"><button data-action="${action}" data-p="${page-1}" ${page<=1?'disabled':''}>${I('chevL',14)}</button><span>Page ${page} of ${pages}</span><button data-action="${action}" data-p="${page+1}" ${page>=pages?'disabled':''}>${I('chevR',14)}</button></div>`}
function sortHeader(label,key,curK,curD){const d=curK===key?curD:'';return `<th class="sortable sort-${d}" data-action="__sort" data-key="${key}">${label}</th>`}
/* FIX: register() MERGES into a persistent ACTIONS map. The old version
   REPLACED the map, so the Reports→Settings tab silently disabled every
   other handler on that page. Handlers are (re)registered on page mount,
   so the active page always wins and existing handlers are preserved. */

const register=map=>{Object.assign(ACTIONS,map)};

  const t=e.target.closest('[data-action]');
  if(t&&t.isConnected){const fn=ACTIONS[t.dataset.action];if(fn){e.preventDefault();fn(t,e)}}
  $$('.dd.open').forEach(d=>{if(!d.contains(e.target))d.classList.remove('open')});
