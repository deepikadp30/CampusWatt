      <div class="mono" style="font-size:12px;color:var(--muted)">Period total: <b style="color:var(--ink);font-size:14px">${nf(D.total)} kWh</b> · ${S().currency}${nf(D.total*S().rate)}</div>
    </div></div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${I('chart',16)} Consumption trend</h3><span class="hint">${st.bucket} buckets · kWh per bucket</span></div>
      <div class="card-b"><div class="chart-box" id="ch-trend"></div>
      <div class="legend">${D.series.map((s,i)=>`<span><i style="background:${cssv(colors[i%6])}"></i>${esc(bName(s.bid))}</span>`).join('')}</div></div></div>
    <div class="grid" style="grid-template-columns:minmax(0,8fr) minmax(0,4fr)">
      <div class="card"><div class="card-h"><h3>${I('building',16)} Building comparison</h3></div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr>
          ${sortHeader('Building','name',st.sortK,st.sortD)}${sortHeader('Type','type',st.sortK,st.sortD)}
          ${sortHeader('Total kWh','total',st.sortK,st.sortD)}${sortHeader('Share','share',st.sortK,st.sortD)}
          ${sortHeader('Avg kW','avg',st.sortK,st.sortD)}${sortHeader('Peak kW','peak',st.sortK,st.sortD)}
          ${sortHeader('kWh/m²','intensity',st.sortK,st.sortD)}${sortHeader('Cost','cost',st.sortK,st.sortD)}
        </tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td><span class="chip mut">${esc(r.type)}</span></td>
          <td class="mono">${nf(r.total)}</td><td class="mono">${nf(r.share,1)}%</td>
          <td class="mono">${nf(r.avg,1)}</td><td class="mono">${nf(r.peak,1)}</td>
          <td class="mono">${r.area?nf(r.intensity,2):'—'}</td><td class="mono">${S().currency}${nf(r.cost)}</td></tr>`).join('')
          ||`<tr><td colspan="8">${emptyBlock('building','No buildings match','Adjust the filter above.')}</td></tr>`}</tbody></table></div></div>
      <div class="card"><div class="card-h"><h3>${I('warn',16)} Unusual usage</h3><span class="hint">z &gt; 3 vs same hour-of-week (14 d)</span></div>
        <div class="card-b" style="padding-top:6px;padding-bottom:6px;max-height:380px;overflow-y:auto">
          ${D.anomalies.slice(0,12).map(a=>`<div class="alert-row"><div class="a-ic" style="background:var(--accent-soft);color:var(--accent)">${I('warn',15)}</div>
            <div style="min-width:0;font-size:12.5px"><div><b>${esc(a.building)}</b> — ${nf(a.v,1)} kWh at ${fmtT(a.t)}</div>
            <div style="color:var(--muted);font-size:11px">${fmtD(a.t)} · typical ${nf(a.mean,1)} ± ${nf(a.sd,1)} · z=${a.z}</div></div></div>`).join('')
            ||emptyBlock('check','Nothing unusual detected','Hourly readings are within expected variation.')}
        </div>
        <div class="card-b" style="border-top:1px solid var(--line)"><button class="btn sm" data-action="an-log">${I('bell',14)} Log these to alert history</button></div></div>
    </div>`;
    lineChart($('#ch-trend'),{height:290,series:D.series.map((s,i)=>({name:bName(s.bid),color:cssv(colors[i%6]),
      points:s.points.map(p=>({x:p.t,y:p.v})),area:D.series.length===1&&st.bucket!=='hour'})),
      yFmt:v=>nf(v),xFmt:v=>st.bucket==='hour'?fmtT(v):st.bucket==='month'?new Date(v).toLocaleDateString('en-US',{month:'short',year:'numeric'}):new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric'})});
  };
  await load();
  register({
    '__sort':t=>{const k=t.dataset.key;if(st.sortK===k)st.sortD=st.sortD==='asc'?'desc':'asc';else{st.sortK=k;st.sortD='asc'}load()},
    'an-bsel':()=>$('#bsel-panel').classList.toggle('open'),
    'an-bsel-apply':()=>{if($('#bsel-all')&&$('#bsel-all').checked){st.ids=null}
      else{const on=$$('#bsel-panel input[data-bid]').filter(c=>c.checked).map(c=>c.dataset.bid);if(!on.length)return toast('Select at least one building or campus total.','warn');st.ids=on}load()},
    'an-bucket':t=>{st.bucket=t.dataset.b;load()},
    'an-apply':()=>{const f=parseWhen($('#an-from').value),t2=parseWhen($('#an-to').value+'T23:59');
      if(isNaN(f)||isNaN(t2)||t2<=f)return toast('Please provide a valid date range (from before to).','err');
      st.from=startOfDay(f);st.to=t2;load()},
    'an-log':async()=>{const r=await api.request('POST','/alerts/scan',{query:{peakDays:0,anomDays:14}});
      if(r.ok){toast(r.data.created?`${r.data.created} unusual-usage event(s) logged to alert history`:'No new anomalies to log');updateBell()}else toast(r.error,'err')},
    'an-csv':()=>{if(!AD)return;const lines=['building_id,timestamp,kwh'];
      AD.series.forEach(s=>s.points.forEach(p=>lines.push(`${s.bid},${new Date(p.t).toISOString()},${p.v??''}`)));
      downloadFile(`analytics_${st.bucket}_${new Date(st.from).toISOString().slice(0,10)}.csv`,lines.join('\n'));toast('CSV downloaded')},
  });
};

/* ================= PAGE 3 — LOAD FORECASTING ================= */
PAGES.forecasting=async root=>{
  const st=ST.forecasting;
  const blds=await api.request('GET','/buildings/all');
  const bList=blds.ok?blds.data:[];
  let F=null,running=false;
  const cached=await api.request('GET','/forecast/latest',{query:{buildingId:st.building,grain:st.grain}});
  F=cached.ok?cached.data:null;
  const draw=()=>{
    root.innerHTML=`
    <div class="page-head"><div><h1>Load Forecasting</h1><div class="sub">Holt-Winters (triple exponential smoothing) with weekly seasonality, fitted on stored hourly readings. Metrics below come from an honest backtest on a held-out period — they describe past performance on the ${DB.data.meta.sample?'sample':'stored'} data and are not a guarantee of future accuracy.</div></div>
      <div class="head-actions"><button class="btn primary" id="fc-run" data-action="fc-run">${I('trend',15)} Run forecast</button></div></div>
    <div class="card" style="margin-bottom:16px"><div class="card-b" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
      <div style="min-width:210px"><label>Building</label><select id="fc-b">
        <option value="*" ${st.building==='*'?'selected':''}>Campus total (all buildings)</option>
        ${bList.map(b=>`<option value="${b.id}" ${st.building===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
      <div><label>Granularity</label><div class="seg">${[['hour','Hourly'],['day','Daily']].map(([k,l])=>`<button data-action="fc-grain" data-g="${k}" class="${st.grain===k?'active':''}">${l}</button>`).join('')}</div></div>
      <div><label>Horizon</label><div class="seg">${(st.grain==='hour'?[[24,'24 h'],[48,'48 h'],[168,'7 days']]:[[7,'7 days'],[14,'14 days']]).map(([k,l])=>`<button data-action="fc-hz" data-h="${k}" class="${+st.horizon===k?'active':''}">${l}</button>`).join('')}</div></div>
    </div></div>
    ${!F?`<div class="card">${emptyBlock('trend','No forecast yet for this selection','Choose a building, granularity and horizon, then press “Run forecast”. The model trains on the stored reading history and reports honest backtest metrics.')}</div>`:`
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${I('trend',16)} Actual vs predicted vs forecast</h3>
      <span class="hint">${esc(F.buildingId==='*'?'Campus total':(bList.find(b=>b.id===F.buildingId)||{}).name||F.buildingId)} · trained ${fmtDT(F.createdAt)} · ${esc(F.unit||'kW')}</span></div>
      <div class="card-b"><div class="chart-box" id="ch-fc"></div>
      <div class="legend"><span><i style="background:${cssv('--c1')}"></i>Actual</span><span><i class="dash" style="color:${cssv('--c5')}"></i>Model fit (one-step)</span><span><i style="background:${cssv('--c3')}"></i>Forecast</span><span><i style="background:${cssv('--c3')};opacity:.4;height:10px"></i>~95% interval (holdout residuals)</span></div></div></div>
    <div class="grid" style="grid-template-columns:minmax(0,4fr) minmax(0,8fr)">
      <div class="card"><div class="card-h"><h3>${I('info',16)} Model evaluation</h3></div>
        <div class="card-b"><div class="stat-mini" style="grid-template-columns:1fr 1fr">
          <div class="sm"><b class="mono">${nf(F.metrics.mae,1)}</b><span>MAE (${esc(F.unit||'kW')})</span></div>
          <div class="sm"><b class="mono">${nf(F.metrics.rmse,1)}</b><span>RMSE</span></div>
          <div class="sm"><b class="mono">${nf(F.metrics.mape,1)}%</b><span>MAPE</span></div>
          <div class="sm"><b class="mono">${nf(F.metrics.sd,1)}</b><span>Residual σ (holdout)</span></div>
          <div class="sm"><b class="mono">${nf(F.metrics.naiveMae,1)}</b><span>Seasonal-naive MAE</span></div>
          <div class="sm"><b class="mono">${F.metrics.skill>0?'+':''}${nf(F.metrics.skill,1)}%</b><span>Skill vs naive</span></div>
        </div>
        <p style="font-size:12px;color:var(--muted);margin-top:12px">Backtest: trained on ${nf(F.metrics.trainPts)} points, evaluated on a held-out week (${F.metrics.testFrom?fmtD(F.metrics.testFrom):'—'} →). Parameters α=${F.metrics.params?F.metrics.params.al:'—'}, β=${F.metrics.params?F.metrics.params.be:'—'}, γ=${F.metrics.params?F.metrics.params.ga:'—'} selected by grid search minimising holdout MAE. These are <b>past</b> performance figures, not promises.</p></div></div>
      ${st.grain==='hour'?
      `<div class="card"><div class="card-h"><h3>${I('warn',16)} Predicted peak-demand periods</h3><span class="hint">forecast &gt; threshold ${nf(S().peakThreshold)} kW</span></div>
        ${F.peaks&&F.peaks.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Window</th><th>Hours</th><th>Peak (kW)</th><th>Upper 95% (kW)</th><th>Excess (kWh)</th><th></th></tr></thead>
        <tbody>${F.peaks.map(w=>`<tr><td>${fmtD(w.start)} · ${fmtT(w.start)}–${fmtT(w.end+HOUR)}</td><td class="mono">${w.h}</td><td class="mono"><b>${nf(w.peak,1)}</b></td><td class="mono">${nf(w.hiUpper,1)}</td><td class="mono">${nf(w.excess,1)}</td>
        <td><button class="btn sm" data-action="fc-opt">Plan reduction</button></td></tr>`).join('')}</tbody></table></div>`
        :`<div class="card-b">${emptyBlock('check','No peaks forecast','No forecast hour exceeds the configured threshold in this horizon.')}</div>`}</div>`
      :`<div class="card"><div class="card-h"><h3>${I('cal',16)} Forecast peak day</h3></div><div class="card-b">
        <div class="stat-mini"><div class="sm"><b class="mono">${F.peakDay?nf(F.peakDay.y,0):'—'}</b><span>kWh forecast</span></div>
        <div class="sm"><b class="mono">${F.peakDay?fmtD(F.peakDay.t):'—'}</b><span>date of predicted maximum</span></div>
        <div class="sm"><b class="mono">${F.peakDay?nf(F.peakDay.hi,0):'—'}</b><span>upper 95% (kWh)</span></div></div>
        <p style="font-size:12px;color:var(--muted);margin-top:12px">Peak-demand detection in kW runs on the hourly model — switch granularity to “Hourly” to see predicted peak windows against the configured threshold.</p></div></div>`}
    </div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h3>${I('info',16)} Model inputs & method</h3></div>
      <div class="card-b"><ul class="assump">
        <li><b>Input data:</b> hourly kWh readings stored in the database for the selected building (last 90 days), summed to campus total when “Campus total” is selected. Missing hours are linearly interpolated before fitting.</li>
        <li><b>Method:</b> additive Holt-Winters — level + trend + ${st.grain==='hour'?'168-hour weekly':'7-day weekly'} seasonality. Only consumption history is used; no weather or occupancy data is available in this dataset.</li>
        <li><b>Evaluation:</b> the final season of data is held out. Grid search picks (α, β, γ) by holdout MAE; the reported MAE/RMSE/MAPE and the 95% interval width come from that held-out backtest only.</li>
        <li><b>Honesty notes:</b> all figures are computed from the ${DB.data.meta.sample?'simulated sample dataset':'stored readings'}; accuracy on real campus data will differ and must be re-measured after deployment.</li>
      </ul></div></div>`}`;
    if(F&&F.forecast&&F.forecast.length){
      const hist=F.history||[],fit=F.fittedWin||[];
      const hStart=hist.length?hist[0].t:F.forecast[0].t;
      lineChart($('#ch-fc'),{height:300,threshold:st.grain==='hour'?S().peakThreshold:null,thresholdLabel:'threshold',
        band:{points:F.forecast.map(f=>({x:f.t,y0:f.lo,y1:f.hi}))},
        series:[
          {name:'Actual',color:cssv('--c1'),points:hist.map(p=>({x:p.t,y:p.v}))},
          {name:'Model fit',color:cssv('--c5'),dashed:true,width:1.4,points:fit.filter(p=>p.t>=hStart).map(p=>({x:p.t,y:p.y}))},
          {name:'Forecast',color:cssv('--c3'),points:[...(hist.length?[{x:hist[hist.length-1].t,y:hist[hist.length-1].v}]:[]),...F.forecast.map(f=>({x:f.t,y:f.y}))]},
        ],
        yFmt:v=>nf(v),xFmt:v=>st.grain==='hour'?new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric'}):fmtD(v)});
    }
  };
  draw();
  const run=async()=>{
    if(running)return;running=true;
    const btn=$('#fc-run');if(btn){btn.disabled=true;btn.innerHTML=I('refresh',15)+' Fitting model…'}
    st.building=$('#fc-b')?$('#fc-b').value:st.building;
    const r=await api.request('POST','/forecast',{body:{buildingId:st.building,grain:st.grain,horizon:+st.horizon}});
    running=false;
    if(!r.ok){toast(r.error,'err');draw()}else{F=r.data;draw();toast(`Forecast ready — held-out MAE ${nf(F.metrics.mae,1)} ${F.unit}`)}
  };
  register({
    'fc-run':run,
    'fc-grain':t=>{st.grain=t.dataset.g;st.horizon=st.grain==='hour'?48:7;
      api.request('GET','/forecast/latest',{query:{buildingId:st.building,grain:st.grain}}).then(r=>{F=r.ok?r.data:null;draw()})},
    'fc-hz':t=>{st.horizon=+t.dataset.h;draw()},
    'fc-opt':()=>go('#/optimization'),
  });
};

/* ================= PAGE 4 — PEAK REDUCTION & OPTIMIZATION ================= */
PAGES.optimization=async root=>{
  const st=ST.optimization;
  const priCls=p=>p==='High'?'err':p==='Medium'?'warn':'mut';
  const stCls=s=>({pending:'mut',accepted:'info',completed:'ok',dismissed:'mut'}[s]||'mut');
  const load=async()=>{
    const r=await api.request('GET','/recommendations');
    if(!r.ok)return errorState(root,r.error);
    await draw(r.data);
  };
  const draw=async recsAll=>{
    recsAll=recsAll||[];
    const recs=recsAll.filter(r=>st.filter==='all'||r.status===st.filter);
    const acted=recsAll.filter(r=>r.status==='accepted'||r.status==='completed');
    const measKwh=recsAll.reduce((a,r)=>a+(r.measuredKwh||0),0);
    const rate=S().rate;
    const target=[...acted,...recsAll.filter(r=>r.status==='pending')].sort((a,b)=>b.windowPeak-a.windowPeak)[0];
    let chart=null;
    if(target){
      const kwCut=recsAll.filter(r=>r.windowStart===target.windowStart&&(r.status==='accepted'||r.status==='completed')).reduce((a,r)=>a+r.kwRed,0);
      const ser=await api.request('GET','/series',{query:{buildingId:'*',from:target.windowStart,to:target.windowEnd+HOUR,bucket:'hour'}});
      if(ser.ok&&ser.data.some(p=>p.v!=null)){
        chart={threshold:S().peakThreshold,
          series:[
            {name:'Baseline demand (kW)',color:cssv('--c4'),points:ser.data.map(p=>({x:p.t,y:p.v}))},
            {name:`Optimised estimate${kwCut?` (−${nf(kwCut,1)} kW)`:''}`,color:cssv('--c1'),points:ser.data.map(p=>({x:p.t,y:p.v==null?null:+Math.max(2,p.v-kwCut).toFixed(2)}))},
          ]};
      }
    }
    root.innerHTML=`
    <div class="page-head"><div><h1>Peak Reduction & Optimization</h1><div class="sub">Transparent, rule-based load-shifting recommendations. Savings shown are <b>estimates</b> (kW × hours × tariff) — they only become “measured” when you record actual metered reductions after implementation.</div></div>
      <div class="head-actions"><div class="seg">
        <button data-action="op-src" data-s="recent" class="${st.source==='recent'?'active':''}">From recent actuals</button>
        <button data-action="op-src" data-s="forecast" class="${st.source==='forecast'?'active':''}">From latest forecast</button></div>
        <button class="btn primary" id="op-detect-btn" data-action="op-detect">${I('zap',15)} Detect peaks &amp; recommend</button></div></div>
    <div class="card" style="margin-bottom:16px"><div class="card-b stat-mini" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
      <div class="sm"><b class="mono">${nf(recsAll.filter(r=>r.status==='pending').reduce((a,r)=>a+r.estKwh,0),0)}</b><span>kWh est. reduction — pending</span></div>
      <div class="sm"><b class="mono">${nf(acted.reduce((a,r)=>a+r.estKwh,0),0)}</b><span>kWh est. reduction — accepted/completed</span></div>
      <div class="sm"><b class="mono">${S().currency}${nf(acted.reduce((a,r)=>a+r.estKwh,0)*rate)}</b><span>est. cost savings (estimated)</span></div>
      <div class="sm"><b class="mono">${nf(measKwh,1)}</b><span>kWh <b>measured</b> savings</span></div>
      <div class="sm"><b class="mono">${S().currency}${nf(measKwh*rate,2)}</b><span>measured cost savings</span></div>
    </div></div>
    ${chart?`<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${I('chart',16)} Baseline vs estimated optimised demand</h3>
      <span class="hint">window ${fmtDT(target.windowStart)} → ${fmtT(target.windowEnd+HOUR)} · peak ${nf(target.windowPeak,1)} kW</span></div>
      <div class="card-b"><div class="chart-box" id="ch-opt"></div>
      <div class="legend"><span><i style="background:${cssv('--c4')}"></i>Baseline (actual/forecast)</span><span><i style="background:${cssv('--c1')}"></i>Estimated optimised (accepted &amp; completed actions only)</span></div></div></div>`:''}
    <div style="display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <div class="seg">${[['all','All'],['pending','Pending'],['accepted','Accepted'],['completed','Completed'],['dismissed','Dismissed']].map(([k,l])=>`<button data-action="op-filter" data-f="${k}" class="${st.filter===k?'active':''}">${l}</button>`).join('')}</div>
      <span style="font-size:12px;color:var(--muted)">${recs.length} recommendation${recs.length===1?'':'s'}</span></div>
    <div class="card" style="margin-bottom:16px">${recs.length?recs.map(r=>`
      <div class="rec-card"><div class="rec-rail" style="background:${r.priority==='High'?'var(--danger)':r.priority==='Medium'?'var(--accent)':'var(--line2)'}"></div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px">
          <b style="font-size:14px">${esc(r.title)}</b>
          <span class="chip ${priCls(r.priority)}">${r.priority} priority</span>
          <span class="chip ${stCls(r.status)}">${r.status}</span>
          <span class="chip mut">${esc(r.difficulty)}</span></div>
        <div style="font-size:12.5px;color:var(--muted);margin-bottom:6px">${esc(r.detail)}</div>
        <div style="font-size:11.5px;color:var(--muted)">${I('clock',12)} ${fmtD(r.windowStart)} · ${fmtT(r.windowStart)}–${fmtT(r.windowEnd+HOUR)} · building peak ${nf(r.windowPeak,1)} kW · ${esc(r.buildingLabel)} · source: ${esc(r.source)}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="mono" style="font-size:15px;font-weight:600">${nf(r.estKwh,1)} kWh</div>
        <div style="font-size:11.5px;color:var(--muted)">≈ ${S().currency}${nf(r.estKwh*rate,2)} est.</div>
        <div style="font-size:11.5px;color:var(--muted)">−${nf(r.kwRed,1)} kW</div>
        ${r.measuredKwh!=null?`<div class="chip ok" style="margin-top:5px">measured ${nf(r.measuredKwh,1)} kWh</div>`:''}
        <div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end;flex-wrap:wrap">
          ${r.status==='pending'?`<button class="btn sm primary" data-action="op-accept" data-id="${r.id}">Accept</button>
          <button class="btn sm" data-action="op-dismiss" data-id="${r.id}">Dismiss</button>`:''}
          ${r.status==='accepted'?`<button class="btn sm primary" data-action="op-complete" data-id="${r.id}">Mark completed</button>
          <button class="btn sm ghost" data-action="op-undo" data-id="${r.id}">Undo</button>`:''}
          ${r.status==='completed'?`<button class="btn sm ghost" data-action="op-measure" data-id="${r.id}">${r.measuredKwh!=null?'Edit measured kWh':'Record measured kWh'}</button>`:''}
        </div>
      </div></div>`).join('')
      :emptyBlock('sliders','Nothing here yet','Detect peak periods to generate recommendations, or adjust the status filter.')}</div>
    <div class="card"><div class="card-h"><h3>${I('info',16)} How estimates are calculated</h3></div>
      <div class="card-b"><ul class="assump">
        <li><b>Peak detection:</b> any hour whose demand (actual or forecast) exceeds the configured threshold (${nf(S().peakThreshold)} kW, editable in Reports → Alerts &amp; Config) is flagged; consecutive hours form a window.</li>
        <li><b>Energy estimate:</b> est. kWh = assumed kW reduction × window hours. E.g. EV: ${S().evCharging?nf(S().evKw*0.6,1):'0'} kW shifted × window length; HVAC: ≈45% of load × 12% trim; lighting: ≈4% of affected buildings' average load.</li>
        <li><b>Cost estimate:</b> est. kWh × energy tariff (${S().currency}${nf(S().rate,3)}/kWh). Demand-charge savings (kW × ${S().currency}${nf(S().demandRate,2)}/kW-month) are <b>not</b> included and would be additional.</li>
        <li><b>Estimated vs measured:</b> “estimated” figures are pre-implementation calculations with explicit assumptions. A recommendation only reports measured savings after you enter the actual metered reduction — until then nothing is claimed as achieved.</li>
      </ul></div></div>`;
    if(chart)lineChart($('#ch-opt'),{height:250,threshold:chart.threshold,thresholdLabel:'threshold',series:chart.series,yFmt:v=>nf(v,1)});
  };
  await load();
  async function completeDlg(id){
    const rec=DB.data.recs.find(r=>r.id===id);if(!rec)return;
    const m=openModal({title:'Mark as completed',
      body:`<p style="font-size:13px;color:var(--muted);margin-bottom:12px">${esc(rec.title)} — ${nf(rec.estKwh,1)} kWh estimated.</p>
        <div class="field"><label>Measured reduction (kWh) — optional</label>
        <input id="cm-kwh" type="number" min="0" step="0.1" value="${rec.measuredKwh??''}" placeholder="e.g. ${nf(rec.estKwh*0.8,1)}"/>
        <div class="err-t">Must be a non-negative number.</div>
        <p style="font-size:11.5px;color:var(--muted);margin-top:5px">Leave empty until you have actual meter data. Only values entered here count as <b>measured</b> savings anywhere in the app.</p></div>`,
      footer:`<button class="btn" data-cancel>Cancel</button><button class="btn primary" id="cm-save">Save &amp; complete</button>`});
    $('#cm-save',m.el).addEventListener('click',async()=>{
      const v=$('#cm-kwh',m.el).value.trim();
      if(v!==''&&(!Number.isFinite(+v)||+v<0)){$('.field',m.el).classList.add('bad');return}
      const r=await api.request('PATCH','/recommendations/'+id,{body:{status:'completed',measuredKwh:v}});
      m.close();if(r.ok){toast(v!==''?`Completed — ${nf(+v,1)} kWh recorded as measured`:'Completed — no measured value recorded yet');load()}else toast(r.error,'err');
    });
  }
  register({
    'op-src':t=>{st.source=t.dataset.s},
    'op-filter':t=>{st.filter=t.dataset.f;load()},
    'op-detect':async t=>{const b=$('#op-detect-btn')||t.closest('button');if(b){b.disabled=true;b.innerHTML=I('refresh',15)+' Detecting…'}
      const r=await api.request('POST','/recommendations/detect',{body:{source:st.source}});
      if(b){b.disabled=false;b.innerHTML=I('zap',15)+' Detect peaks & recommend'}
      if(!r.ok)toast(r.error,'err');else{toast(`${r.data.count} recommendation(s) generated from ${r.data.label}`);load()}},
    'op-accept':async t=>{const r=await api.request('PATCH','/recommendations/'+t.dataset.id,{body:{status:'accepted'}});r.ok?toast('Recommendation accepted — shown in the optimised-demand estimate'):toast(r.error,'err');load()},
    'op-dismiss':async t=>{const r=await api.request('PATCH','/recommendations/'+t.dataset.id,{body:{status:'dismissed'}});r.ok?toast('Recommendation dismissed'):toast(r.error,'err');load()},
    'op-undo':async t=>{const r=await api.request('PATCH','/recommendations/'+t.dataset.id,{body:{status:'pending'}});r.ok?toast('Moved back to pending'):toast(r.error,'err');load()},
    'op-complete':t=>completeDlg(t.dataset.id),
    'op-measure':t=>completeDlg(t.dataset.id),
  });
};

/* ================= PAGE 5 — CAMPUS & DATA MANAGEMENT ================= */
PAGES.campus=async root=>{
  const st=ST.campus;
  const tab=CURRENT.query.tab||'buildings';
  const tabs=['buildings','records','import','quality'];
  const drawTabs=()=>{
    root.innerHTML=`<div class="tabs">${tabs.map(t=>`<button class="tab ${t===tab?'active':''}" data-action="cam-tab" data-t="${t}">${I({buildings:'building',records:'clock',import:'ul',quality:'check'}[t])} ${TABNAMES.campus[t]}</button>`).join('')}</div><div id="cam-body"></div>`;
  };
  const body=()=>$('#cam-body');
  /* ---- buildings tab ---- */
  const loadBuildings=async focusId=>{
    const r=await api.request('GET','/buildings',{query:{search:st.q,sort:st.sortK,dir:st.sortD,page:st.page,pageSize:8}});
    if(!r.ok)return errorState(body(),r.error);
    const D=r.data;
    body().innerHTML=`
    <div class="card"><div class="card-h"><h3>${I('building',16)} Campus buildings</h3>
      <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
        <input id="cb-q" placeholder="Search name or type…" value="${esc(st.q)}" style="width:200px;padding:7px 10px"/>
        <button class="btn primary" data-action="cb-add">${I('plus',15)} Add building</button></div></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        ${sortHeader('Name','name',st.sortK,st.sortD)}${sortHeader('Type','type',st.sortK,st.sortD)}
        ${sortHeader('Area (m²)','area',st.sortK,st.sortD)}${sortHeader('Occupancy','occupancy',st.sortK,st.sortD)}
        <th>HVAC</th><th>Equipment</th><th style="text-align:right">Actions</th>
      </tr></thead><tbody>${D.items.map(b=>`<tr id="row-${b.id}"><td><b>${esc(b.name)}</b>${b.sample?' <span class="chip mut">sample</span>':''}</td>
        <td><span class="chip mut">${esc(b.type)}</span></td><td class="mono">${nf(b.area)}</td><td class="mono">${nf(b.occupancy)}</td>
        <td>${b.hvac?'<span class="chip ok">Yes</span>':'<span class="chip mut">No</span>'}</td>
        <td style="max-width:220px;font-size:12px;color:var(--muted)">${esc((b.equipment||'').length>60?b.equipment.slice(0,59)+'…':b.equipment)}</td>
        <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-action="cb-view" data-id="${b.id}">${I('eye',13)}</button>
        <button class="btn sm" data-action="cb-edit" data-id="${b.id}">${I('pen',13)}</button>
        <button class="btn sm" data-action="cb-del" data-id="${b.id}" style="color:var(--danger)">${I('trash',13)}</button></td></tr>`).join('')
        ||`<tr><td colspan="7">${emptyBlock('building','No buildings found',st.q?'No match for “'+esc(st.q)+'”.':'Add your first building to start recording energy data.')}</td></tr>`}</tbody></table></div>
      ${pagerHtml(D.page,D.pages,'cb-page')}</div>`;
    const qi=$('#cb-q');if(qi)qi.addEventListener('input',debounce(()=>{st.q=qi.value;st.page=1;loadBuildings()},180));
    if(focusId){const el=$('#row-'+focusId);if(el){el.scrollIntoView({block:'center'});el.classList.add('row-flash')}}
  };
  /* ---- records tab ---- */
  const loadRecords=async()=>{
    const q={buildingId:st.rB||undefined,page:st.rPage,pageSize:12};
    if(st.rFrom)q.from=+parseWhen(st.rFrom);if(st.rTo)q.to=+parseWhen(st.rTo)+DAY;
    const[rb,rbld]=await Promise.all([api.request('GET','/readings',{query:q}),api.request('GET','/buildings/all')]);
    if(!rb.ok)return errorState(body(),rb.error);
    const D=rb.data,bList=rbld.ok?rbld.data:[];
    const bName=id=>(bList.find(b=>b.id===id)||{}).name||id;
    body().innerHTML=`
    <div class="card"><div class="card-h"><h3>${I('clock',16)} Energy records</h3>
      <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
        <select id="cr-b" style="width:170px"><option value="">All buildings</option>${bList.map(b=>`<option value="${b.id}" ${st.rB===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
        <input type="date" id="cr-from" value="${st.rFrom}" style="width:140px"/><input type="date" id="cr-to" value="${st.rTo}" style="width:140px"/>
        <button class="btn" data-action="cr-filter">Filter</button>
        <button class="btn primary" data-action="cr-add">${I('plus',15)} Add reading</button></div></div>
      <div style="padding:8px 17px;font-size:12px;color:var(--muted)">${nf(D.total)} record${D.total===1?'':'s'} in filter</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Building</th><th>Timestamp</th><th>kWh</th><th style="text-align:right">Actions</th></tr></thead>
      <tbody>${D.items.map(r=>`<tr><td>${esc(bName(r.b))}</td><td class="mono">${fmtDT(r.ts)}</td><td class="mono"><b>${nf(r.kwh,1)}</b></td>
        <td style="text-align:right;white-space:nowrap"><button class="btn sm" data-action="cr-edit" data-id="${r.id}">${I('pen',13)}</button>
        <button class="btn sm" data-action="cr-del" data-id="${r.id}" style="color:var(--danger)">${I('trash',13)}</button></td></tr>`).join('')
        ||`<tr><td colspan="4">${emptyBlock('clock','No readings found','Add a reading or widen the filter.')}</td></tr>`}</tbody></table></div>
      ${pagerHtml(D.page,D.pages,'cr-page')}</div>`;
  };
  /* ---- import tab ---- */
  const loadImport=()=>{
    body().innerHTML=`
    <div class="grid" style="grid-template-columns:minmax(0,7fr) minmax(0,5fr)">
      <div class="card"><div class="card-h"><h3>${I('ul',16)} Upload CSV readings</h3></div><div class="card-b">
        <div class="drop-zone" id="dz">${I('ul',30)}<div style="margin-top:8px"><b>Drop a CSV file here</b> or click to browse</div>
          <div style="font-size:12px;margin-top:4px">Columns: <span class="mono">building_id</span> (or <span class="mono">building_name</span>), <span class="mono">timestamp</span>, <span class="mono">kwh</span></div></div>
        <input type="file" id="csv-file" accept=".csv,text/csv" style="display:none"/>
        <div id="csv-result" style="margin-top:14px"></div>
      </div></div>
      <div class="card"><div class="card-h"><h3>${I('file',16)} Template &amp; rules</h3></div><div class="card-b">
        <button class="btn" data-action="ci-template">${I('dl',15)} Download sample CSV template</button>
        <ul class="assump" style="margin-top:14px">
          <li><b>Validation:</b> rows are checked for a known building, a parseable timestamp and a non-negative kWh value; invalid rows are rejected with the row number and reason.</li>
          <li><b>Duplicates:</b> a row is skipped if that building already has a reading for the same hour — either in the database or earlier in the same file.</li>
          <li><b>Timestamps:</b> <span class="mono">YYYY-MM-DD HH:MM</span> (or ISO). Values are snapped to the hour.</li>
          <li>Imported readings appear immediately across Dashboard, Analytics and Forecasting.</li>
        </ul></div></div>
    </div>`;
    const dz=$('#dz'),fi=$('#csv-file');
    dz.addEventListener('click',()=>fi.click());
    dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over')});
    dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
    dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});
    fi.addEventListener('change',()=>{if(fi.files[0])handleFile(fi.files[0])});
    async function handleFile(file){
      const text=await file.text();
      const rows=parseCSV(text);
      if(rows.length<2){$('#csv-result').innerHTML=`<div class="chip err">The file appears to be empty or has no data rows.</div>`;return}
      const hdr=rows[0].map(h=>h.trim().toLowerCase());
      const pick=names=>{for(const n of names){const i=hdr.indexOf(n);if(i>=0)return i}return -1};
      const ci=pick(['building_id','buildingid','id']),ni=pick(['building_name','name','building']),ti=pick(['timestamp','time','date_time','datetime']),ki=pick(['kwh','energy_kwh','consumption_kwh','value']);
      if(ti<0||ki<0||(ci<0&&ni<0)){$('#csv-result').innerHTML=`<div class="chip err">Missing required columns. Need building_id (or building_name), timestamp and kwh. Download the template for the exact format.</div>`;return}
      const objs=rows.slice(1).map(r=>({building_id:ci>=0?r[ci]:'',building_name:ni>=0?r[ni]:'',timestamp:ti>=0?r[ti]:'',kwh:ki>=0?r[ki]:''}));
      $('#csv-result').innerHTML=`<div class="chip info">Parsed ${objs.length} data row(s). Ready to validate.</div>`;
      const btn=document.createElement('button');btn.className='btn primary';btn.style.marginTop='10px';btn.textContent=`Validate & import ${objs.length} row${objs.length===1?'':'s'}`;
      $('#csv-result').appendChild(btn);
      btn.addEventListener('click',async()=>{
        btn.disabled=true;btn.textContent='Importing…';
        const r=await api.request('POST','/readings/import',{body:{rows:objs}});
        if(!r.ok){$('#csv-result').innerHTML=`<div class="chip err">${esc(r.error)}</div>`;return}
        const D=r.data;
        $('#csv-result').innerHTML=`
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
            <span class="chip ok">${D.imported} imported</span>
            ${D.dupCount?`<span class="chip warn">${D.dupCount} duplicate(s) skipped</span>`:''}
            ${D.errorCount?`<span class="chip err">${D.errorCount} error(s)</span>`:`<span class="chip ok">no errors</span>`}</div>
          ${D.duplicates.length?`<b style="font-size:12.5px">Duplicates (first ${D.duplicates.length})</b><div style="font-size:12px;color:var(--muted);margin:4px 0 10px">${D.duplicates.map(d=>`Row ${d.row}: ${esc(d.msg)}`).join('<br>')}</div>`:''}
          ${D.errors.length?`<b style="font-size:12.5px">Errors (first ${D.errors.length})</b><div class="tbl-wrap" style="margin-top:4px"><table class="tbl" style="min-width:0"><tbody>${D.errors.map(e=>`<tr><td class="mono" style="width:60px">Row ${e.row}</td><td style="color:var(--danger);font-size:12px">${esc(e.msg)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
        toast(`${D.imported} reading(s) imported${D.dupCount?`, ${D.dupCount} duplicate(s) skipped`:''}${D.errorCount?`, ${D.errorCount} row(s) rejected`:''}`,D.errorCount?'warn':'ok');
      });
    }
  };
  /* ---- quality tab ---- */
  const loadQuality=async()=>{
    const r=await api.request('GET','/quality');
    if(!r.ok)return errorState(body(),r.error);
    const rows=r.data,warn=rows.filter(x=>x.missing>0||x.coverage<80);
    body().innerHTML=`
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${I('check',16)} Data quality summary</h3>
      <span class="hint">coverage = % of expected hours with readings over the last 30 days · missing = hours without data in the last 7 days</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Building</th><th>Records</th><th>First reading</th><th>Latest reading</th><th>30-day coverage</th><th>Missing (7 d)</th><th>Status</th></tr></thead>
      <tbody>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td class="mono">${nf(x.records)}</td>
        <td class="mono">${x.first?fmtD(x.first):'—'}</td><td class="mono">${x.last?fmtDT(x.last):'—'}</td>
        <td class="mono">${x.coverage}%</td><td class="mono">${x.missing?`<b style="color:var(--accent)">${x.missing} h</b>`:'0 h'}</td>
        <td>${x.coverage>=80&&x.missing===0?'<span class="chip ok">Good</span>':x.missing>0?'<span class="chip warn">Gaps in last 7 days</span>':'<span class="chip warn">Low coverage</span>'}</td></tr>`).join('')}</tbody></table></div></div>
    ${warn.length?`<div class="card"><div class="card-h"><h3>${I('warn',16)} Missing-data warnings</h3></div><div class="card-b">
      ${warn.map(x=>`<div class="alert-row"><div class="a-ic" style="background:var(--accent-soft);color:var(--accent)">${I('warn',15)}</div>
      <div style="font-size:13px"><b>${esc(x.name)}</b> — ${x.missing>0?`${x.missing} hour(s) without readings in the last 7 days. `:''}${x.coverage<80?`Only ${x.coverage}% coverage over the last 30 days; forecasts and analytics will be less reliable until gaps are filled (import via CSV or add readings manually).`:''}</div></div>`).join('')}
    </div></div>`:`<div class="card"><div class="card-b">${emptyBlock('check','All buildings look healthy','No missing-hour warnings for the last 7 days.')}</div></div>`}`;
  };
  /* ---- building form ---- */
  function buildingForm(id){
    const b=id?DB.data.buildings.find(x=>x.id===id):null;
    const m=openModal({title:b?'Edit building':'Add building',wide:true,
      body:`<div class="form-grid">
        <div class="field"><label>Name *</label><input id="bf-name" value="${esc(b?b.name:'')}"/><div class="err-t"></div></div>
        <div class="field"><label>Type</label><select id="bf-type">${['Academic','Laboratory','Library','Residence','Athletic','Dining','Other'].map(t=>`<option ${b&&b.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
        <div class="field"><label>Area (m²) *</label><input id="bf-area" type="number" min="1" value="${b?b.area:''}"/><div class="err-t"></div></div>
        <div class="field"><label>Peak occupancy</label><input id="bf-occ" type="number" min="0" value="${b?b.occupancy:0}"/><div class="err-t"></div></div>
        <div class="field"><label>Controllable load (kW)</label><input id="bf-ck" type="number" min="0" step="0.1" value="${b?b.controllableKw:0}"/><div class="err-t"></div>
          <p style="font-size:11px;color:var(--muted);margin-top:3px">Schedulable equipment (ovens, rigs) usable for load-shifting recommendations.</p></div>
        <div class="field"><label>HVAC metered here</label><select id="bf-hvac"><option value="1" ${b&&b.hvac?'selected':''}>Yes</option><option value="0" ${b&&b.hvac?'':'selected'}>No</option></select></div>
      </div>
      <div class="field"><label>Equipment details</label><textarea id="bf-eq" rows="2">${esc(b?b.equipment:'')}</textarea></div>
      <div class="field" style="margin-bottom:0"><label>Notes</label><textarea id="bf-notes" rows="2">${esc(b?b.notes:'')}</textarea></div>`,
      footer:`<button class="btn" data-cancel>Cancel</button><button class="btn primary" id="bf-save">${b?'Save changes':'Create building'}</button>`});
    $('#bf-save',m.el).addEventListener('click',async()=>{
      $$('.field',m.el).forEach(f=>f.classList.remove('bad'));
      const payload={name:$('#bf-name',m.el).value,type:$('#bf-type',m.el).value,area:$('#bf-area',m.el).value,
        occupancy:+$('#bf-occ',m.el).value||0,controllableKw:$('#bf-ck',m.el).value,hvac:$('#bf-hvac',m.el).value==='1',
        equipment:$('#bf-eq',m.el).value,notes:$('#bf-notes',m.el).value};
      const r=await api.request(b?'PUT':'POST',b?'/buildings/'+id:'/buildings',{body:payload});
      if(!r.ok){const msg=r.error;const f=$$('.field',m.el)[0];f.classList.add('bad');f.querySelector('.err-t').textContent=msg;
        if(!/name/i.test(msg))toast(msg,'err');return}
      m.close();toast(b?'Building updated':'Building created — add readings or import CSV data for it');loadBuildings();
    });
  }
  function readingForm(id){
    const r=id?DB.data.readings.find(x=>x.id===id):null;
    api.request('GET','/buildings/all').then(rb=>{
      const bList=rb.ok?rb.data:[];
      const m=openModal({title:r?'Edit reading':'Add reading',
        body:`<div class="field"><label>Building *</label><select id="rf-b">${bList.map(b=>`<option value="${b.id}" ${r&&r.b===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Timestamp * (snapped to the hour)</label><input id="rf-ts" type="datetime-local" value="${tsInput(r?r.ts:floorHour(Date.now()))}"/><div class="err-t"></div></div>
        <div class="field"><label>Consumption (kWh) *</label><input id="rf-kwh" type="number" min="0" step="0.1" value="${r?r.kwh:''}"/><div class="err-t"></div></div>`,
        footer:`<button class="btn" data-cancel>Cancel</button><button class="btn primary" id="rf-save">${r?'Save changes':'Add reading'}</button>`});
      $('#rf-save',m.el).addEventListener('click',async()=>{
        $$('.field',m.el).forEach(f=>f.classList.remove('bad'));
        const payload={buildingId:$('#rf-b',m.el).value,timestamp:$('#rf-ts',m.el).value,kwh:$('#rf-kwh',m.el).value};
        const res=await api.request(r?'PUT':'POST',r?'/readings/'+id:'/readings',{body:payload});
        if(!res.ok){const bad=/kwh/i.test(res.error)?2:/building/i.test(res.error)?0:1;
          const f=$$('.field',m.el)[bad]||$$('.field',m.el)[1];f.classList.add('bad');f.querySelector('.err-t').textContent=res.error;toast(res.error,'err');return}
        m.close();toast(r?'Reading updated':'Reading added');
        if(CURRENT.path==='campus'&&(!CURRENT.query.tab||CURRENT.query.tab==='records'))loadRecords();
        else renderApp();
      });
    });
  }
  drawTabs();
  if(tab==='buildings')await loadBuildings(CURRENT.query.focus);
  else if(tab==='records')await loadRecords();
  else if(tab==='import')loadImport();
  else await loadQuality();
  register({
    'cam-tab':t=>{setQuery({tab:t.dataset.t,focus:''});PAGES.campus(root)},
    'cb-page':t=>{st.page=+t.dataset.p;loadBuildings()},
    'cb-add':()=>buildingForm(null),
    'cb-edit':t=>buildingForm(t.dataset.id),
    'cb-view':t=>{const b=DB.data.buildings.find(x=>x.id===t.dataset.id);if(!b)return;
      openModal({title:esc(b.name),body:`<div class="stat-mini" style="margin-bottom:14px">
        <div class="sm"><b>${esc(b.type)}</b><span>type</span></div><div class="sm"><b class="mono">${nf(b.area)} m²</b><span>area</span></div>
        <div class="sm"><b class="mono">${nf(b.occupancy)}</b><span>peak occupancy</span></div>
        <div class="sm"><b class="mono">${b.controllableKw?nf(b.controllableKw,1)+' kW':'—'}</b><span>controllable load</span></div></div>
        <p style="font-size:13px;margin-bottom:6px"><b>Equipment:</b> ${esc(b.equipment)||'—'}</p>
        <p style="font-size:13px"><b>Notes:</b> ${esc(b.notes)||'—'}</p>`})},
    'cb-del':async t=>{const b=DB.data.buildings.find(x=>x.id===t.dataset.id);if(!b)return;
      if(await confirmDlg({title:'Delete building?',message:`“${esc(b.name)}” and all of its energy readings will be permanently deleted.`,okText:'Delete',danger:true})){
        const r=await api.request('DELETE','/buildings/'+b.id);if(r.ok){toast('Building deleted');loadBuildings()}else toast(r.error,'err')}},
    'cr-page':t=>{st.rPage=+t.dataset.p;loadRecords()},
    'cr-filter':()=>{st.rB=$('#cr-b').value;st.rFrom=$('#cr-from').value;st.rTo=$('#cr-to').value;st.rPage=1;loadRecords()},
    'cr-add':()=>readingForm(null),
    'cr-edit':t=>readingForm(t.dataset.id),
    'cr-del':async t=>{if(await confirmDlg({title:'Delete reading?',message:'This energy record will be permanently removed.',okText:'Delete',danger:true})){
      const r=await api.request('DELETE','/readings/'+t.dataset.id);if(r.ok){toast('Reading deleted');if(CURRENT.path==='campus'&&(!CURRENT.query.tab||CURRENT.query.tab==='records'))loadRecords();else renderApp();}else toast(r.error,'err')}},
    'ci-template':()=>{const first=DB.data.buildings[0];
      const lines=['building_id,building_name,timestamp,kwh'];
      if(first){lines.push(`${first.id},${first.name},2025-06-01 08:00,38.4`);lines.push(`${first.id},${first.name},2025-06-01 09:00,45.1`)}
      downloadFile('campusgrid_readings_template.csv',lines.join('\n'));
      toast('Sample template downloaded')},
    '__sort':t=>{const k=t.dataset.key;if(st.sortK===k)st.sortD=st.sortD==='asc'?'desc':'asc';else{st.sortK=k;st.sortD='asc'}loadBuildings()},
  });
};

/* ================= PAGE 6 — REPORTS, ALERTS & SETTINGS ================= */
PAGES.reports=async root=>{
  const tab=CURRENT.query.tab||'reports';
  const tabs=['reports','alerts','settings','info'];
  let rep=null;
  const drawTabs=()=>{root.innerHTML=`<div class="tabs">${tabs.map(t=>`<button class="tab ${t===tab?'active':''}" data-action="rep-tab" data-t="${t}">${I({reports:'file',alerts:'bell',settings:'gear',info:'info'}[t])} ${TABNAMES.reports[t]}</button>`).join('')}</div><div id="rep-body"></div>`};
  const body=()=>$('#rep-body');
  /* ---- reports tab ---- */
  const drawReports=()=>{
    const today=new Date().toISOString().slice(0,10);
    body().innerHTML=`
    <div class="grid" style="grid-template-columns:minmax(0,4fr) minmax(0,8fr)">
      <div class="card"><div class="card-h"><h3>${I('cal',16)} Generate report</h3></div><div class="card-b">
        <div class="field"><label>Period type</label><select id="rp-period"><option value="day">Daily</option><option value="week">Weekly</option><option value="month">Monthly</option></select></div>
        <div class="field"><label>Reference date</label><input type="date" id="rp-date" value="${today}"/></div>
        <button class="btn primary" data-action="rp-gen" style="width:100%;justify-content:center">${I('file',15)} Generate</button>
        <p style="font-size:11.5px;color:var(--muted);margin-top:10px">Daily = that calendar day · Weekly = Mon–Sun containing the date · Monthly = calendar month.</p></div></div>
      <div id="rp-out" class="card"><div class="card-b">${emptyBlock('file','No report generated yet','Choose a period and press Generate.')}</div></div>
    </div>`;
  };
  const renderReport=()=>{
    if(!rep)return;
    $('#rp-out').innerHTML=`
      <div class="card-h"><h3>${I('file',16)} ${rep.label} energy report — ${fmtD(rep.from)} → ${fmtD(rep.to-1)}</h3>
        <div style="display:flex;gap:8px"><button class="btn sm" data-action="rp-csv">${I('dl',14)} CSV</button>
        <button class="btn sm" data-action="rp-print">${I('printer',14)} Print / PDF</button></div></div>
      <div class="card-b"><div class="stat-mini" style="margin-bottom:14px">
        <div class="sm"><b class="mono">${nf(rep.campus.kwh)}</b><span>campus kWh</span></div>
        <div class="sm"><b class="mono">${S().currency}${nf(rep.campus.cost)}</b><span>energy cost</span></div>
        <div class="sm"><b class="mono">${nf(rep.campus.peak,1)} kW</b><span>peak demand</span></div>
        <div class="sm"><b class="mono">${rep.campus.windows}</b><span>hours over threshold</span></div></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Building</th><th>Type</th><th>kWh</th><th>Share</th><th>Cost</th><th>Peak kW</th></tr></thead>
      <tbody>${rep.buildings.map(b=>`<tr><td>${esc(b.name)}</td><td><span class="chip mut">${esc(b.type)}</span></td><td class="mono">${nf(b.kwh)}</td>
        <td class="mono">${nf(b.share,1)}%</td><td class="mono">${S().currency}${nf(b.cost,2)}</td><td class="mono">${nf(b.peak,1)}</td></tr>`).join('')}</tbody></table></div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px">Costs use the energy tariff only (${S().currency}${nf(rep.rate,3)}/kWh); demand charges not included. Estimated savings from accepted recommendations are excluded from these actuals.</p></div>`;
  };
  /* ---- alerts & config tab ---- */
  const loadAlerts=async()=>{
    const[ra,rs]=await Promise.all([api.request('GET','/alerts'),api.request('GET','/settings')]);
    if(!ra.ok)return errorState(body(),ra.error);
    const s=rs.ok?rs.data:S(),items=ra.data.items;
    const sel=$('#af-sel');const filt=sel?sel.value:'all';
    const shown=items.filter(a=>filt==='all'||(filt==='unread'?!a.read:a.type===filt));
    body().innerHTML=`
    <div class="grid" style="grid-template-columns:minmax(0,4fr) minmax(0,8fr)">
      <div>
        <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>${I('gear',16)} Thresholds &amp; tariffs</h3></div><div class="card-b">
          <div class="field"><label>Peak-demand threshold (kW)</label><input id="cf-th" type="number" min="1" value="${s.peakThreshold}"/><div class="err-t"></div></div>
          <div class="field"><label>Energy tariff (${s.currency}/kWh)</label><input id="cf-rate" type="number" min="0" step="0.001" value="${s.rate}"/><div class="err-t"></div></div>
          <div class="field"><label>Demand charge (${s.currency}/kW-month)</label><input id="cf-dem" type="number" min="0" step="0.01" value="${s.demandRate}"/><div class="err-t"></div></div>
          <button class="btn primary" data-action="cf-save" style="width:100%;justify-content:center">Save configuration</button>
        </div></div>
        <div class="card"><div class="card-h"><h3>${I('zap',16)} Run checks</h3></div><div class="card-b">
          <button class="btn" data-action="al-scan" style="width:100%;justify-content:center">${I('refresh',15)} Scan peaks (7 d) &amp; anomalies (14 d)</button>
          <p style="font-size:11.5px;color:var(--muted);margin-top:8px">Creates alert records for threshold exceedances and unusual consumption. Deduplicated per day.</p>
        </div></div>
      </div>
      <div class="card"><div class="card-h"><h3>${I('bell',16)} Alert history</h3>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="af-sel" style="width:150px"><option value="all">All types</option><option value="peak">Peak demand</option><option value="anomaly">Unusual usage</option><option value="unread">Unread only</option></select>
          <button class="btn sm" data-action="al-readall">Mark all read</button></div></div>
        <div class="card-b" style="padding-top:6px;padding-bottom:6px;max-height:560px;overflow-y:auto">
        ${shown.map(a=>`<div class="alert-row" style="opacity:${a.read?'.6':'1'}">
          <div class="a-ic" style="background:${a.type==='peak'?'var(--danger-soft)':'var(--accent-soft)'};color:${a.type==='peak'?'var(--danger)':'var(--accent)'}">${I(a.type==='peak'?'zap':'warn',15)}</div>
          <div style="flex:1;min-width:0;font-size:12.5px"><div>${esc(a.message)}</div>
          <div style="color:var(--muted);font-size:11px;margin-top:2px">${fmtDT(a.ts)} · <span class="chip ${a.severity==='high'?'err':a.severity==='medium'?'warn':'mut'}" style="font-size:10px">${a.severity}</span></div></div>
          ${!a.read?`<button class="btn sm ghost" data-action="al-read" data-id="${a.id}">Mark read</button>`:''}
          <button class="btn sm ghost" data-action="al-del" data-id="${a.id}" style="color:var(--danger)">${I('trash',13)}</button></div>`).join('')
          ||emptyBlock('bell','No alerts match','Run a scan or adjust the filter.')}</div></div>
    </div>`;
    $('#af-sel').value=filt;
    $('#af-sel').addEventListener('change',loadAlerts);
  };
  /* ---- settings tab ---- */
  const loadSettings=async()=>{
    const rs=await api.request('GET','/settings');
    if(!rs.ok)return errorState(body(),rs.error);
    const s=rs.data;
    body().innerHTML=`
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card"><div class="card-h"><h3>${I('building',16)} Campus details</h3></div><div class="card-b">
        <div class="field"><label>Campus name</label><input id="st-name" value="${esc(s.campusName)}"/></div>
        <div class="field"><label>Location</label><input id="st-loc" value="${esc(s.location)}"/></div>
        <div class="form-grid">
          <div class="field"><label>Currency symbol</label><input id="st-cur" value="${esc(s.currency)}" maxlength="4"/></div>
          <div class="field"><label>User name</label><input id="st-user" value="${esc(s.userName)}"/></div>
          <div class="field"><label>Role</label><input id="st-role" value="${esc(s.role)}"/></div>
        </div></div></div>
      <div class="card"><div class="card-h"><h3>${I('sliders',16)} Preferences</h3></div><div class="card-b">
        <div class="field"><label>Theme</label><div class="seg" id="st-theme">
          <button data-v="light" class="${s.theme==='light'?'active':''}">Light</button>
          <button data-v="dark" class="${s.theme==='dark'?'active':''}">Dark</button></div></div>
        <div class="field"><label>Reduce motion</label><div class="seg" id="st-motion">
          <button data-v="0" class="${!s.reduceMotion?'active':''}">Normal</button>
          <button data-v="1" class="${s.reduceMotion?'active':''}">Reduced</button></div></div>
        <div class="field"><label>EV charging load present on campus</label><div class="seg" id="st-ev">
          <button data-v="1" class="${s.evCharging?'active':''}">Yes</button>
          <button data-v="0" class="${!s.evCharging?'active':''}">No</button></div></div>
        <div class="field"><label>EV peak load (kW)</label><input id="st-evkw" type="number" min="0" value="${s.evKw}"/></div>
        <button class="btn primary" data-action="st-save" style="width:100%;justify-content:center">Save settings</button>
        <button class="btn" data-action="st-reset" style="width:100%;justify-content:center;margin-top:9px;color:var(--danger)">Reset &amp; reseed sample data</button>
      </div></div>
    </div>`;
    let theme=s.theme,motion=s.reduceMotion?1:0,ev=s.evCharging?1:0;
    $('#st-theme').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;theme=b.dataset.v;$$('#st-theme button').forEach(x=>x.classList.toggle('active',x===b))});
    $('#st-motion').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;motion=+b.dataset.v;$$('#st-motion button').forEach(x=>x.classList.toggle('active',x===b))});
    $('#st-ev').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;ev=+b.dataset.v;$$('#st-ev button').forEach(x=>x.classList.toggle('active',x===b))});
    register({'st-save':async()=>{ // merged into ACTIONS — all other handlers stay alive
      const r=await api.request('PUT','/settings',{body:{campusName:$('#st-name').value,location:$('#st-loc').value,currency:$('#st-cur').value,
        userName:$('#st-user').value,role:$('#st-role').value,theme,reduceMotion:!!motion,evCharging:!!ev,evKw:$('#st-evkw').value}});
      if(!r.ok)return toast(r.error,'err');
      applyTheme();renderChrome();toast('Settings saved — they persist across refreshes');
    }});
  };
  /* ---- info tab ---- */
  const loadInfo=()=>{
    body().innerHTML=`<div class="card doc"><div class="card-h"><h3>${I('info',16)} Project information</h3></div><div class="card-b">
      <h4 style="margin-top:0">Campus Energy Load Forecasting &amp; Peak Reduction System</h4>
      <p>A campus energy management application: it stores building-level electricity readings, forecasts demand with a transparent statistical model, detects peak-demand periods against a configurable threshold, and proposes rule-based load-shifting actions with explicitly estimated savings.</p>
      <h4>Objectives</h4><ul>
        <li>Maintain a single source of truth for campus buildings and hourly energy readings (manual entry + CSV import with validation and duplicate detection).</li>
        <li>Forecast hourly and daily demand using Holt-Winters triple exponential smoothing, with honest hold-out evaluation (MAE / RMSE / MAPE / skill vs seasonal-naive).</li>
        <li>Detect peak-demand windows and generate prioritised, rule-based recommendations: EV charging shifts, lab equipment scheduling, HVAC optimisation and lighting trims.</li>
        <li>Track recommendations through accept → complete, separating <b>estimated</b> savings (kW × hours × tariff, assumptions stated) from <b>measured</b> savings (entered only after real meter verification).</li></ul>
      <h4>Architecture</h4>
      <p>Three cleanly separated layers in this build: a UI layer (six routed pages), a simulated REST-style API layer with validation and typed errors, and a persistent browser-storage layer (buildings, readings, forecasts, recommendations, alerts, settings) that survives refresh. <b>This is not a real server or database</b> — persistence uses localStorage and the API runs in-page; the conventional API boundary means the storage layer can later be swapped for Express + SQLite/PostgreSQL without touching the pages.</p>
      <h4>Forecasting method</h4>
      <p>Additive Holt-Winters (level, trend, weekly seasonality; m=168 for hourly, m=7 for daily). The final season of history is held out; (α, β, γ) are chosen by a 27-point grid search minimising hold-out MAE, and the 95% forecast interval uses the hold-out residual standard deviation. No accuracy is claimed beyond what the backtest on the stored (currently sample) data shows, and no weather/occupancy data is used because none is collected yet.</p>
      <h4>Data disclaimer</h4>
      <p>${DB.data.meta.sample?'The current dataset is <b>labelled sample data</b> generated for demonstration — profiles simulate academic, laboratory, residential, athletic and dining load shapes with noise, hot-day effects and rare spikes.':'The dataset contains user-supplied readings.'} Replace it via Campus &amp; Data → CSV Import or Reset &amp; reseed in Settings.</p>
      <h4>Key assumptions used in savings estimates</h4><ul>
        <li>Energy cost = kWh × flat tariff; demand-charge savings reported separately and not silently folded in.</li>
        <li>EV shift moves ~60% of configured EV peak load overnight; lab shift assumes 70% of declared controllable load; HVAC assumes 45% of building load with a 12% window trim; lighting assumes ~4% of affected buildings' average load.</li>
        <li>Estimated savings become “measured” only when a metered value is recorded against a completed recommendation.</li></ul>
    </div></div>`;
  };
  drawTabs();
  if(tab==='reports')drawReports();else if(tab==='alerts')await loadAlerts();else if(tab==='settings')await loadSettings();else loadInfo();
  register({
    'rep-tab':t=>{setQuery({tab:t.dataset.t});PAGES.reports(root)},
    'rp-gen':async()=>{
      const period=$('#rp-period').value,date=$('#rp-date').value;
      const r=await api.request('GET','/report',{query:{period,date}});
      if(!r.ok)return toast(r.error,'err');
      rep=r.data;renderReport();toast(`${rep.label} report generated`)},
    'rp-csv':()=>{if(!rep)return;const L=[`# ${rep.label} energy report ${fmtD(rep.from)} - ${fmtD(rep.to-1)}`,
      `# campus_kwh,${rep.campus.kwh},campus_cost,${rep.campus.cost},peak_kw,${rep.campus.peak},hours_over_threshold,${rep.campus.windows}`,
      'building,type,kwh,share_pct,cost,peak_kw',
      ...rep.buildings.map(b=>[csvCell(b.name),b.type,b.kwh,b.share,b.cost,b.peak].join(','))];
      downloadFile(`${rep.period}_report_${new Date(rep.from).toISOString().slice(0,10)}.csv`,L.join('\n'));toast('Report CSV downloaded')},
    'rp-print':()=>{if(!rep)return;
      $('#print-root').innerHTML=`<div class="pr"><h2>${esc(S().campusName)} — ${rep.label} Energy Report</h2>
        <div style="font-size:12px">${fmtD(rep.from)} → ${fmtD(rep.to-1)} · tariff ${S().currency}${nf(rep.rate,3)}/kWh</div>
        <p style="font-size:12.5px">Campus total: <b>${nf(rep.campus.kwh)} kWh</b> · cost ${S().currency}${nf(rep.campus.cost)} · peak ${nf(rep.campus.peak,1)} kW · ${rep.campus.windows} h above ${nf(S().peakThreshold)} kW threshold</p>
        <table><tr><th>Building</th><th>Type</th><th>kWh</th><th>Share %</th><th>Cost</th><th>Peak kW</th></tr>
        ${rep.buildings.map(b=>`<tr><td>${esc(b.name)}</td><td>${esc(b.type)}</td><td>${nf(b.kwh)}</td><td>${nf(b.share,1)}</td><td>${S().currency}${nf(b.cost,2)}</td><td>${nf(b.peak,1)}</td></tr>`).join('')}</table>
        <div class="pr-note">Generated ${fmtDT(Date.now())} by CampusGrid. Figures derive from stored readings; costs exclude demand charges. Sample data if seeded as such.</div></div>`;
      window.print()},
    'cf-save':async()=>{
      $$('#rep-body .field').forEach(f=>f.classList.remove('bad'));
      const r=await api.request('PUT','/settings',{body:{peakThreshold:$('#cf-th').value,rate:$('#cf-rate').value,demandRate:$('#cf-dem').value}});
      if(!r.ok)return toast(r.error,'err');
      toast('Threshold & tariff configuration saved');updateBell()},
    'al-scan':async()=>{const r=await api.request('POST','/alerts/scan',{});
      if(!r.ok)return toast(r.error,'err');
      toast(r.data.created?`${r.data.created} new alert(s) created`:'No new alerts — everything already recorded');updateBell();loadAlerts()},
    'al-readall':async()=>{await api.request('POST','/alerts/read-all');updateBell();loadAlerts()},
    'al-read':async t=>{await api.request('PATCH','/alerts/'+t.dataset.id,{body:{read:true}});updateBell();loadAlerts()},
    'al-del':async t=>{await api.request('DELETE','/alerts/'+t.dataset.id);updateBell();loadAlerts()},
    'st-reset':async()=>{if(await confirmDlg({title:'Reset all data?',message:'Every record is deleted and the labelled sample dataset is reloaded.',okText:'Reset & reseed',danger:true})){await api.request('POST','/reset-sample');location.reload()}},
  });
};

/* ================= router & boot (fully guarded — never blank) ================= */
async function renderApp(){
  const root=$('#page');
  try{
    CURRENT=parseHash();
    renderChrome();
  }catch(e){
    console.error('Chrome init failed:',e);
    CURRENT={path:'dashboard',query:{}};
    try{renderChrome()}catch(e2){console.error(e2)}
  }
  root.innerHTML='';
  root.appendChild(skeleton());
  try{
    const page=PAGES[CURRENT.path];
    if(!page)throw new Error('Unknown route: '+CURRENT.path);
    await page(root);
  }catch(e){
    console.error('Page render failed:',e);
    errorState(root,e.message||'Unexpected error while loading this page.');
  }
}
window.renderApp=renderApp;
window.addEventListener('hashchange',renderApp);

(async function boot(){
  try{
    const [rs, rb] = await Promise.all([
      api.request('GET', '/settings'),
      api.request('GET', '/buildings/all')
    ]);
    if (rs.ok && rs.data) DB.data.settings = rs.data;
    if (rb.ok && Array.isArray(rb.data)) {
      DB.data.buildings = rb.data;
      DB.data.meta.sample = rb.data.some(b => b.sample);
    }
    applyTheme();
    await renderApp();
  }catch(e){
    console.error('Boot render failed:', e);
    if(window.__cgBootFail) window.__cgBootFail(e.message || 'Boot failed');
  }
  window.__CG_BOOTED=true; // watchdog: main script completed booting
})();
</script>
<script>
/* SAFETY NET 2: boot watchdog. If the main script never finished booting
   (parse error, early crash, truncated file), paint a visible error into
   #page instead of leaving it blank. */
window.addEventListener('load',function(){
  setTimeout(function(){
    if(!window.__CG_BOOTED&&window.__cgBootFail){
      window.__cgBootFail('The main application script did not finish booting. Open the browser console (F12) for the underlying error, then use “Reset data & reload”.');
    }
  },1200);
});
</script>
